name: Sync Gitee -> GitHub

# 定时触发：默认每小时同步一次；也可手动触发
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 关键：将 GITHUB_TOKEN 写入 git 凭据，使后续 git push 可免密认证
          persist-credentials: true

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch from Gitee
        run: |
          # Gitee 公开仓库可通过 HTTPS 直接读取，无需凭据
          git remote add gitee https://gitee.com/qingmingzi/agent-sshelper.git
          git fetch gitee master
          echo "::group::Gitee master log"
          git log --oneline -5 gitee/master
          echo "::endgroup::"

      - name: Fast-forward master to Gitee
        run: |
          git checkout master
          git merge --ff-only gitee/master

      - name: Push to GitHub
        run: |
          git push origin master --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}